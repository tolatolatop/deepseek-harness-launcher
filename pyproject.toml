[project]
name = "deepseek-harness-launcher"
version = "0.1.0"
description = "A private team workspace for DeepSeek Harness"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlmodel>=0.0.24,<0.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "docker>=7.1,<8",
  "websockets>=15,<16",
  "python-multipart>=0.0.20",
  "pyyaml>=6,<7",
  "pymysql[rsa]>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "pytest-asyncio>=0.26"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
