name: deepseek-launcher
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: launcher
      POSTGRES_USER: launcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launcher -d launcher"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: deepseek-launcher:local
    container_name: dsh-launcher-api
    user: "1000:1000"
    env_file: .env
    environment:
      LAUNCHER_DATABASE_URL: postgresql+psycopg://launcher:${POSTGRES_PASSWORD}@postgres/launcher
      LAUNCHER_CONTROL_CONTAINERS: dsh-launcher-api,dsh-launcher-worker
    volumes:
      - ${LAUNCHER_DATA_ROOT:?Set an absolute data path}:${LAUNCHER_DATA_ROOT}
    ports:
      - "127.0.0.1:${PORT:-18080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,urllib.parse; p=urllib.parse.urlsplit(os.environ['LAUNCHER_PUBLIC_URL']).path.rstrip('/'); urllib.request.urlopen('http://localhost:8000'+p+'/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control, egress]
    restart: unless-stopped
  worker:
    image: deepseek-launcher:local
    container_name: dsh-launcher-worker
    command: ["python", "-m", "launcher.worker"]
    env_file: .env
    environment:
      LAUNCHER_DATABASE_URL: postgresql+psycopg://launcher:${POSTGRES_PASSWORD}@postgres/launcher
      LAUNCHER_CONTROL_CONTAINERS: dsh-launcher-api,dsh-launcher-worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${LAUNCHER_DATA_ROOT}:${LAUNCHER_DATA_ROOT}
    depends_on:
      api:
        condition: service_healthy
    networks: [control, egress]
    restart: unless-stopped
  runtime-image:
    image: ${LAUNCHER_RUNTIME_IMAGE:-runzhliu/deepseek-harness:0.2.1-rc.2-r1}
    profiles: [images]
    entrypoint: ["true"]
    network_mode: none
networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${LAUNCHER_CONTROL_SUBNET:-10.204.0.0/28}
  egress:
    ipam:
      config:
        - subnet: ${LAUNCHER_EGRESS_SUBNET:-10.204.0.16/28}
volumes:
  postgres-data:
